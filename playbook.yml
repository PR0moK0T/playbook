---
- name: Установка и запуск Nginx
  hosts: all
  become: true

  tasks:
    - name: Установка пакета Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Запуск и включение автозагрузки Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
